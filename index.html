<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>阿廖顧狗</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <header id="topbar">
    <h1>阿廖顧狗</h1>
    <button id="room-name" title="切換房間">客廳 ▸</button>
    <button id="day-btn" title="今天的進度">今天 0/5 ▸</button>
    <button id="tasks-toggle" aria-expanded="false">任務清單</button>
  </header>

  <aside id="tasks-panel" hidden>
    <section>
      <h2>必備任務</h2>
      <ul id="main-tasks" class="task-list"></ul>
    </section>
    <section>
      <h2>支線任務</h2>
      <ul id="side-tasks" class="task-list"></ul>
    </section>
  </aside>

  <div id="goal" hidden></div>
  <div id="compass" hidden><div id="compass-arrow">▲</div><span id="compass-text"></span></div>
  <div id="alert" role="alert" hidden>⚠ 廚房柵欄沒關！回去把柵欄關上</div>

  <div id="hint"></div>

  <div id="joystick" hidden><div id="stick"></div></div>

  <footer id="hud">
    <div class="cell stat"><b id="task-count">0/0</b><small>任務</small></div>
    <div class="cell face"><canvas id="portrait"></canvas><small>巴福柔</small></div>
    <nav id="views" class="cell" aria-label="視角">
      <button data-view="overview" class="active">俯瞰</button>
      <button data-view="human">人</button>
      <button data-view="dog">狗</button>
      <button data-view="cat">貓</button>
    </nav>
  </footer>

  <section id="walk" hidden></section>
  <div id="coach" hidden></div>
  <div id="card" hidden></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
